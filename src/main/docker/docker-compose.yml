version: "3.8"
services:
  # Quarkus Application
  quarkus-app:
    build:
      context: ../../../
      dockerfile: src/main/docker/Dockerfile.jvm
    image: quarkus-rest:latest
    container_name: local_quarkus_app
    ports:
      - "8080:8080"
      - "9000:9000"   # Management port
    environment:
      QUARKUS_DATASOURCE_HOST: postgresql
      QUARKUS_DATASOURCE_PORT: 5432
      QUARKUS_DATASOURCE_DB: db_local
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
      QUARKUS_DATASOURCE_SCHEMA: sch_local
      QUARKUS_MANAGEMENT_ENABLED: "true"
      # Redis configuration
      QUARKUS_REDIS_HOSTS: redis://redis:6379
      # MinIO configuration — port 9000 is MinIO's container-internal listen port
      # (see the minio service's own healthcheck below); 9090 is only the host-side mapping.
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      # Tracing configuration
      QUARKUS_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/q/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - local_network

  # PostgreSQL Database
  postgresql:
    image: postgres:15-alpine
    container_name: local_postgres
    environment:
      POSTGRES_DB: db_local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - local_network
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: local_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - local_network

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: local_minio
    ports:
      - "9090:9000"   # API (changed from 9000 to avoid conflict)
      - "9091:9001"   # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - local_network
    volumes:
      - minio_data:/data

  # Jaeger
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: local_jaeger
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - local_network

networks:
  local_network:
    driver: bridge
    name: local_network

volumes:
  pgdata:
  minio_data:
